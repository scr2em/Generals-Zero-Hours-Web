# Builds the WebAssembly version of Zero Hour and publishes it to GitHub Pages.
#
# It runs only for pushes whose head commit message contains the word
# "release" (any case), or when started by hand from the Actions tab.
# Commits containing [skip ci] never start it.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". The github-pages environment may restrict which branches
# can deploy (Settings -> Environments -> github-pages).

name: Web release

on:
  push:
    branches:
      - main
      - claude/festive-pasteur-1jgfbn
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-release
  cancel-in-progress: false

env:
  EMSDK_VERSION: 6.0.11

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Cache the Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install the Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install ${EMSDK_VERSION}

      - name: Activate the Emscripten SDK
        run: |
          ~/emsdk/emsdk activate ${EMSDK_VERSION}
          source ~/emsdk/emsdk_env.sh
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          emcc --version

      - name: Configure
        run: cmake --preset emscripten -B build/web

      - name: Build
        run: cmake --build build/web --target z_generals starter_pack

      - name: Assemble the site
        run: bash scripts/web/assemble_pages.sh build/web site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
