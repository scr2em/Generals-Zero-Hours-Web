<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>web_audio_test</title>
<style>
  body { margin: 8px; background: #222; color: #ddd; font: 12px monospace; }
  pre { margin: 4px; white-space: pre-wrap; }
</style>
</head>
<body>
<h3>web_audio_test</h3>
<pre id="log"></pre>
<script>
  var logEl = document.getElementById('log');
  function logLine(s) { console.log(s); logEl.textContent += s + '\n'; }
  var Module = {
    print: logLine, printErr: logLine,
    // ?args=chain,streams runs only those scenarios (decode volume positional lowpass chain suspend streams)
    arguments: (new URLSearchParams(location.search).get('args') || '').split(',').filter(Boolean),
    // ?wait=1 holds the start of the program until the first click, like the launcher's Play button does
    // (the click is the user gesture that lets the page play audio from then on).
    preRun: [function () {
      if (new URLSearchParams(location.search).get('wait') !== '1') return;
      Module.addRunDependency('play-click');
      document.addEventListener('pointerdown', function () { Module.removeRunDependency('play-click'); }, { once: true });
    }],
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
