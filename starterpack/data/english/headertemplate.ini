; Starter pack named fonts for window text. WND files refer to these names (HEADERTEMPLATE).

HeaderTemplate Default
  Font = "DejaVu Sans"
  Point = 12
  Bold = No
End

HeaderTemplate Small
  Font = "DejaVu Sans"
  Point = 10
  Bold = No
End

HeaderTemplate Label
  Font = "DejaVu Sans"
  Point = 12
  Bold = Yes
End

HeaderTemplate Button
  Font = "DejaVu Sans"
  Point = 14
  Bold = Yes
End

HeaderTemplate Heading
  Font = "DejaVu Sans"
  Point = 18
  Bold = Yes
End

HeaderTemplate Title
  Font = "DejaVu Sans"
  Point = 28
  Bold = Yes
End

HeaderTemplate Tiny
  Font = "DejaVu Sans"
  Point = 8
  Bold = No
End
