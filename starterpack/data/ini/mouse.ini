; Starter pack mouse settings. The tooltip look and one cursor entry per cursor kind the game asks for.
; The cursor art is data\cursors\sp_<name>.ANI (generated by gen/cursors.py).

Mouse
  TooltipFontName = "DejaVu Sans"
  TooltipFontSize = 10
  TooltipFontIsBold = No
  TooltipAnimateBackground = Yes
  TooltipFillTime = 50
  TooltipDelayTime = 400
  TooltipTextColor = R:255 G:255 B:255 A:255
  TooltipHighlightColor = R:255 G:230 B:120 A:255
  TooltipShadowColor = R:0 G:0 B:0 A:255
  TooltipBackgroundColor = R:20 G:24 B:32 A:230
  TooltipBorderColor = R:90 G:110 B:140 A:255
  TooltipWidth = 15%
  OrthoCamera = No
  OrthoZoom = 1.0
  DragTolerance = 10
  DragTolerance3D = 2
  DragToleranceMS = 150
End

MouseCursor Normal
  Texture = sp_normal
  HotSpot = X:2 Y:2
  Frames = 1
  FPS = 1.0
  Directions = 1
End

MouseCursor Arrow
