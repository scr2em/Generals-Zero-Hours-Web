GameData
  DefaultStartingCash = 5000
  MoveHintName = SPMoveHint
  ; construction and economy
  BuildSpeed = 1.0
  MinDistFromEdgeOfMapForBuild = 30.0
  SupplyBuildBorder = 20.0
  AllowedHeightVariationForBuilding = 12.0
  MinLowEnergyProductionSpeed = 0.5
  MaxLowEnergyProductionSpeed = 0.9
  LowEnergyPenaltyModifier = 0.6
  MultipleFactory = 0.85
  RefundPercent = 50%
  SellPercentage = 50%
  ValuePerSupplyBox = 100
  MaxLineBuildObjects = 10
  ; sizes of renderer buffers; the engine's defaults are 0, which makes the terrain track buffer ask for a vertex buffer
  ; with no vertices (an assertion at start up in a debug build) and leaves the road buffers empty
  MaxTerrainTracks = 100
  MaxRoadSegments = 1000
  MaxRoadVertex = 4000
  MaxRoadIndex = 6000
  MaxRoadTypes = 4
  MaxTunnelCapacity = 10

  ; veterancy health bonuses
  HealthBonus_Veteran = 120%
  HealthBonus_Elite = 140%
  HealthBonus_Heroic = 160%

  ; the same lighting for every time of day, a clear afternoon
  TimeOfDay = AFTERNOON
  Weather = NORMAL
  NumberGlobalLights = 1
  TerrainLightingMorningAmbient = R:110 G:110 B:120
  TerrainLightingMorningDiffuse = R:200 G:190 B:170
  TerrainLightingMorningLightPos = X:-0.5 Y:-0.4 Z:-0.8
  TerrainLightingAfternoonAmbient = R:120 G:120 B:125
  TerrainLightingAfternoonDiffuse = R:215 G:205 B:185
  TerrainLightingAfternoonLightPos = X:-0.4 Y:0.5 Z:-0.75
  TerrainLightingEveningAmbient = R:100 G:95 B:110
  TerrainLightingEveningDiffuse = R:200 G:150 B:120
  TerrainLightingEveningLightPos = X:0.6 Y:0.3 Z:-0.7
  TerrainLightingNightAmbient = R:50 G:55 B:80
  TerrainLightingNightDiffuse = R:80 G:90 B:130
  TerrainLightingNightLightPos = X:0.2 Y:0.2 Z:-0.9
  TerrainObjectsLightingMorningAmbient = R:110 G:110 B:120
  TerrainObjectsLightingMorningDiffuse = R:200 G:190 B:170
  TerrainObjectsLightingMorningLightPos = X:-0.5 Y:-0.4 Z:-0.8
  TerrainObjectsLightingAfternoonAmbient = R:120 G:120 B:125
  TerrainObjectsLightingAfternoonDiffuse = R:215 G:205 B:185
  TerrainObjectsLightingAfternoonLightPos = X:-0.4 Y:0.5 Z:-0.75
  TerrainObjectsLightingEveningAmbient = R:100 G:95 B:110
  TerrainObjectsLightingEveningDiffuse = R:200 G:150 B:120
  TerrainObjectsLightingEveningLightPos = X:0.6 Y:0.3 Z:-0.7
  TerrainObjectsLightingNightAmbient = R:50 G:55 B:80
  TerrainObjectsLightingNightDiffuse = R:80 G:90 B:130
  TerrainObjectsLightingNightLightPos = X:0.2 Y:0.2 Z:-0.9

  ; bookkeeping the engine wants to find
  AutoFireParticleSmallPrefix = SmallFire
  AutoFireParticleSmallSystem = StarterSmallFire
  AutoFireParticleSmallMax = 3
  AutoSmokeParticleSmallPrefix = SmallSmoke
  AutoSmokeParticleSmallSystem = StarterSmallSmoke
  AutoSmokeParticleSmallMax = 3
End
