; Starter pack command sets: which buttons each selectable thing shows, by slot.
; The control bar has 14 command slots, numbered left to right, top to bottom.

CommandSet StarterEmptyCommandSet
End

CommandSet IronwoodHQCommandSet
  1  = Command_TrainIronwoodWorker
  13 = Command_SetRallyPoint
  14 = Command_Sell
End

CommandSet IronwoodPowerCommandSet
  14 = Command_Sell
End

CommandSet IronwoodBarracksCommandSet
  1  = Command_TrainIronwoodRifleman
  2  = Command_TrainIronwoodRocketeer
  13 = Command_SetRallyPoint
  14 = Command_Sell
End

CommandSet IronwoodFactoryCommandSet
  1  = Command_TrainIronwoodScout
  2  = Command_TrainIronwoodTank
  13 = Command_SetRallyPoint
  14 = Command_Sell
End

; The workers have no attack move: a selection of workers and combat units shows the attack move of the combat units in
; the combat units' slot, and a second one in another slot would map the same hot key twice (HotKey.cpp asserts).
CommandSet IronwoodWorkerCommandSet
  1  = Command_ConstructIronwoodPowerPlant
  2  = Command_ConstructIronwoodBarracks
  3  = Command_ConstructIronwoodFactory
  14 = Command_Stop
End

CommandSet IronwoodCombatCommandSet
  1  = Command_AttackMove
  2  = Command_Guard
  3  = Command_Stop
End
