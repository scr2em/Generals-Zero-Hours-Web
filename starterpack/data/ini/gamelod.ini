; Starter pack detail levels. Light settings: nothing here is expensive.
; MaxTankTrackEdges must not be 0: it sizes the terrain track vertex buffer (W3DTerrainTracks.cpp), and a buffer with no vertices asserts.

StaticGameLOD Low
  MinimumFPS = 0
  MinimumProcessorFps = 0
  SampleCount2D = 6
  SampleCount3D = 12
  StreamCount = 2
  MaxParticleCount = 500
  UseShadowVolumes = No
  UseShadowDecals = Yes
  UseCloudMap = No
  UseLightMap = No
  ShowSoftWaterEdge = No
  MaxTankTrackEdges = 100
  MaxTankTrackOpaqueEdges = 25
  MaxTankTrackFadeDelay = 300000
  UseBuildupScaffolds = No
  UseTreeSway = No
  UseEmissiveNightMaterials = No
  UseHeatEffects = No
  TextureReductionFactor = 0
End

