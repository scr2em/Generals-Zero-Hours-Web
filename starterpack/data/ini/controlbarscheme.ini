; Starter pack control bar schemes: one layout, three sides (the observer and the fallback share it).

ControlBarScheme Default
  ScreenCreationRes = X:800 Y:600
  Side = Default
  ImagePart
    Position = X:0 Y:440
    Size = X:800 Y:160
    ImageName = SP_BarBackground
    Layer = 3
  End
  RightHUDImage = SP_SideIronwood
  QueueButtonImage = SP_QueueEmpty
  BuildUpClockColor = R:0 G:0 B:0 A:160
  ButtonBorderBuildColor = R:70 G:150 B:220 A:255
  CommandBarBorderColor = R:232 G:168 B:48 A:255
  ButtonBorderActionColor = R:80 G:190 B:90 A:255
  ButtonBorderUpgradeColor = R:230 G:200 B:60 A:255
  ButtonBorderSystemColor = R:200 G:200 B:210 A:255
  MinMaxUL = X:160 Y:442
  MinMaxLR = X:172 Y:456
  GeneralUL = X:772 Y:442
  GeneralLR = X:794 Y:458
  UAttackUL = X:4 Y:446
  UAttackLR = X:158 Y:596
  OptionsUL = X:504 Y:442
  OptionsLR = X:526 Y:458
  WorkerUL = X:478 Y:442
  WorkerLR = X:500 Y:458
  ChatUL = X:556 Y:442
  ChatLR = X:578 Y:458
  BeaconUL = X:530 Y:442
  BeaconLR = X:552 Y:458
  PowerBarUL = X:280 Y:444
  PowerBarLR = X:470 Y:456
  MoneyUL = X:172 Y:442
  MoneyLR = X:272 Y:458
End

