; Starter pack: water per time of day. GPL-3.0-or-later, original work.

WaterSet MORNING
  SkyTexture = swsky.tga
  WaterTexture = swwater.tga
  Vertex00Color = R:255 G:255 B:255 A:255
  Vertex10Color = R:255 G:255 B:255 A:255
  Vertex01Color = R:255 G:255 B:255 A:255
  Vertex11Color = R:255 G:255 B:255 A:255
  DiffuseColor = R:120 G:160 B:190 A:255
  TransparentDiffuseColor = R:100 G:150 B:180 A:255
  UScrollPerMS = 0.00002
  VScrollPerMS = 0.00003
  SkyTexelsPerUnit = 0.004
  WaterRepeatCount = 8
End

