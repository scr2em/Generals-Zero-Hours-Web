; Starter pack 2D animations (Anim2D.cpp). The game draws a small icon over an object for certain states and looks the
; animations up by the fixed names in TheDrawableIconNames (Drawable.cpp): healing, disabled, bombs, battle plans,
; enthusiasm. A missing one makes the drawing code ask for an image that does not exist, every frame, for every such
; object. The pack has one picture per kind (gen/ui_art.py), one frame each; "Emoticon" is chosen at run time and not here.

Animation DefaultHeal
  NumberImages = 1
  Image = SP_IconHeal
  AnimationMode = LOOP
  AnimationDelay = 100
End

