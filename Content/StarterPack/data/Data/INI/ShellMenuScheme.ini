; Starter pack menu backdrops. W3DShellMenuSchemeDraw paints the images and lines of the scheme that
; the shell loaded (MainMenu.cpp loads "MainMenu").

ShellMenuScheme MainMenu
  ImagePart
    Position = X:0 Y:0
    Size = X:800 Y:600
    ImageName = SP_MenuBackdrop
  End
  LinePart
    StartPosition = X:0 Y:560
    EndPosition = X:800 Y:560
    Color = R:232 G:168 B:48 A:255
    Width = 2
  End
End
