; Starter pack AI settings and the computer player's base layout for the Ironwood Compact.
; Original work, GPL-3.0-or-later.
;
; The skirmish AI places its base relative to its command center. It turns the layout by 135 degrees
; (a fixed rotation in the engine), so the Location values below are the wanted offsets from the HQ,
; rotated by -135 degrees: for a wanted offset (dx, dy) the entry is
; (-0.7071 dx + 0.7071 dy, -0.7071 dx - 0.7071 dy). The first structure must be the command center.

AIData
  StructureSeconds = 8.0
  TeamSeconds = 12.0
  Wealthy = 6000
  Poor = 1500
  ForceIdleMSEC = 500
  StructuresWealthyRate = 2.0
  TeamsWealthyRate = 2.0
  StructuresPoorRate = 0.5
  TeamsPoorRate = 0.5
  TeamResourcesToStart = 100.0
  GuardInnerModifierAI = 1.1
  GuardOuterModifierAI = 1.333
  GuardInnerModifierHuman = 1.8
  GuardOuterModifierHuman = 2.2
  GuardChaseUnitsDuration = 5000
  GuardEnemyScanRate = 1000
  GuardEnemyReturnScanRate = 1000
  SkirmishGroupFudgeDistance = 20.0
  RepulsedDistance = 20.0
  EnableRepulsors = No
  AlertRangeModifier = 1.1
  AggressiveRangeModifier = 1.5
  ForceSkirmishAI = No
  RotateSkirmishBases = No
  AttackUsesLineOfSight = Yes
  AttackIgnoreInsignificantBuildings = Yes
  AttackPriorityDistanceModifier = 100.0
  MaxRecruitRadius = 500.0
  SkirmishBaseDefenseExtraDistance = 150.0
