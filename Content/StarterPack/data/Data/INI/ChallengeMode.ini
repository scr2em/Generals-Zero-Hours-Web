; Starter pack: the one "general" record the engine looks for. The challenge mode itself is not part of the pack,
; but the loading screen, the faction lists of the setup screens and the preferences ask this table about the
; player template ("persona") of every playable faction: the portrait and name shown on the loading screen come
; from here (LoadScreen.cpp, GUIUtil.cpp, UserPreferences.cpp). Original work, GPL-3.0-or-later.
ChallengeGenerals
  GeneralPersona0
    StartsEnabled = Yes
    PlayerTemplate = FactionIronwood
    BioNameString = INI:FactionIronwood
    BioPortraitSmall = SP_SideIronwood
    BioPortraitLarge = SP_SideIronwood
  End
End
