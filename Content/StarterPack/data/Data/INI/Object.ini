Object IronwoodHQ
  Buildable = Yes
  Scale = 1.0   ; engine default is uninitialised in older builds; 0 makes the model vanish
  Side = Ironwood
  EditorSorting = STRUCTURE
  DisplayName = OBJECT:IronwoodHQ
  VoiceSelect = StarterSelectBuilding
  ButtonImage = SP_HQ
  SelectPortrait = SP_HQ
  Draw = W3DModelDraw ModuleTag_Draw
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model = iw_hq
    End
  End
  KindOf = STRUCTURE SELECTABLE IMMOBILE COMMANDCENTER SCORE MP_COUNT_FOR_VICTORY FS_FACTORY CAN_SEE_THROUGH_STRUCTURE
  Body = StructureBody ModuleTag_Body
    MaxHealth = 3000.0
    InitialHealth = 3000.0
  End
  ArmorSet
    Conditions = None
    Armor = IronwoodStructureArmor
    DamageFX = None
  End
  Behavior = ProductionUpdate ModuleTag_Production
    MaxQueueEntries = 5
  End
  Behavior = DefaultProductionExitUpdate ModuleTag_Exit
    UnitCreatePoint = X:45.0 Y:0.0 Z:0.0
    NaturalRallyPoint = X:80.0 Y:0.0 Z:0.0
  End
  Behavior = AutoDepositUpdate ModuleTag_Income
    DepositTiming = 5000
    DepositAmount = 50
    ActualMoney = Yes
  End
  ; the minimap: the headquarters grants itself the upgrade, and the upgrade switches the player's radar on
  Behavior = GrantUpgradeCreate ModuleTag_GrantRadar
    UpgradeToGrant = Upgrade_IronwoodRadar
    ExemptStatus = UNDER_CONSTRUCTION
  End
  Behavior = RadarUpgrade ModuleTag_Radar
    TriggeredBy = Upgrade_IronwoodRadar
  End
  Behavior = DestroyDie ModuleTag_Destroy
  End
  Behavior = FXListDie ModuleTag_DeathFX
    DeathFX = FX_StarterBuildingDie
  End
  CommandSet = IronwoodHQCommandSet
  BuildCost = 2000
  BuildTime = 30.0
  VisionRange = 220.0
  ShroudClearingRange = 320.0
  EnergyProduction = 0
  RadarPriority = STRUCTURE
  Geometry = BOX
  GeometryMajorRadius = 38.0
  GeometryMinorRadius = 38.0
  GeometryHeight = 30.0
  GeometryIsSmall = No
  FactoryExitWidth = 20.0
  WeaponSet
    Conditions = None
  End
End

