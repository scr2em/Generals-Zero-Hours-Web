; Starter pack: baseline engine settings. GPL-3.0-or-later, original work.
; Technical defaults shared by every game mode; gameplay tuning is in ..\GameData.ini.

GameData
  Windowed = No
  XResolution = 1024
  YResolution = 768
  UseTrees = Yes
  UseFPSLimit = Yes
  FramesPerSecondLimit = 60
  MaxShellScreens = 8

  ; terrain and water quality
  UseCloudMap = No
  UseLightMap = No
  BilinearTerrainTex = Yes
  TrilinearTerrainTex = No
  MultiPassTerrain = No
  AdjustCliffTextures = No
  Use3WayTerrainBlends = 0
  StretchTerrain = No
  UseHalfHeightMap = No
  DrawEntireTerrain = No
  TerrainLOD = MAX
  UseWaterPlane = No
  UseCloudPlane = No
  UseShadowVolumes = No
  UseShadowDecals = Yes
  TextureReductionFactor = 0
  UseBehindBuildingMarker = Yes
  ShowSoftWaterEdge = Yes
  MaxTerrainTracks = 100
  MakeTrackMarks = No
  DrawSkyBox = No

  ; camera
  CameraPitch = 38.0
  CameraYaw = 0.0
  MaxCameraHeight = 310.0
  MinCameraHeight = 90.0
  CameraAdjustSpeed = 0.1
  ViewportHeightScale = 0.733
  TerrainHeightAtEdgeOfMap = 0.0
  EnforceMaxCameraHeight = Yes
  HorizontalScrollSpeedFactor = 1.0
  VerticalScrollSpeedFactor = 1.0
  KeyboardScrollSpeedFactor = 1.0
  KeyboardDefaultScrollSpeedFactor = 1.0
  KeyboardCameraRotateSpeed = 0.1

  ; physics and damage presentation
  Gravity = -1.0
  GroundStiffness = 0.5
  StructureStiffness = 0.5
  UnitDamagedThreshold = 0.5
  UnitReallyDamagedThreshold = 0.1
  PartitionCellSize = 40.0
  DefaultStructureRubbleHeight = 8.0
  DefaultOcclusionDelay = 3000
  StealthFriendlyOpacity = 50%

  ; particles
  ParticleScale = 1.0
  MaxParticleCount = 1500
  MaxFieldParticleCount = 30

  ; audio on by default
  AudioOn = Yes
  MusicOn = Yes
  SoundsOn = Yes
  Sounds3DOn = Yes
  SpeechOn = Yes
  VideoOn = No
  CameraAudibleRadius = 500.0

  ; selection feedback
  GroupSelectMinSelectSize = 5
  GroupSelectVolumeBase = 0.5
  GroupSelectVolumeIncrement = 0.02
  MaxUnitSelectSounds = 4
  SelectionFlashSaturationFactor = 0.5
  SelectionFlashHouseColor = No
  GroupMoveClickToGatherAreaFactor = 1.0

  ; screen shake
  ShakeSubtleIntensity = 0.5
  ShakeNormalIntensity = 1.0
  ShakeStrongIntensity = 2.5
  ShakeSevereIntensity = 5.0
  ShakeCineExtremeIntensity = 8.0
  ShakeCineInsaneIntensity = 12.0
  MaxShakeIntensity = 10.0
  MaxShakeRange = 150.0

  ; the shell map is optional; with ShellMapOn = No the main menu uses a flat backdrop
  ShellMapName = Maps\ShellMap1\ShellMap1.map
  ShellMapOn = No
  PlayIntro = No
End
