; Starter pack window transitions.
;
; The engine calls TransitionHandler->reverse(group) for several groups and does not tolerate a missing
; one (it dereferences the result), so every group name the game code can ask for exists here.
; Groups without Window entries do nothing: the menus of the starter content simply appear.
; The quit menu is the exception: it relies on QuitFull / QuitFullBack to show and hide itself.

WindowTransition ChallengeButtonsIntro
End

WindowTransition ChallengeMenuFade
End

WindowTransition ControlBarArrow
End

WindowTransition FadeWholeScreen
End

WindowTransition GameSpyGameOptionsMenuFade
End

WindowTransition GameSpyLoginProfileFade
End

WindowTransition GenExpFade
End

WindowTransition LanGameOptionsFade
End

WindowTransition LanLobbyFade
End

WindowTransition MainMenuDefaultMenu
End

WindowTransition MainMenuDefaultMenuBack
End

; MainMenuInit hides the drop-downs and MainMenuUpdate then plays this group: it is what brings the button panel
; back when the main menu is entered again after another screen (the first time the panel appears on mouse movement).
WindowTransition MainMenuDefaultMenuLogoFade
  Window
    WinName = MainMenu.wnd:MapBorder2
    Style = WINFADE
    FrameDelay = 0
  End
End

