; Starter pack player templates ("factions"): the playable Ironwood Compact, plus the observer and
; the neutral civilian side that the game logic looks up by name.

PlayerTemplate FactionObserver
  Side = Observer
  BaseSide = Observer
  PlayableSide = No
  IsObserver = Yes
  DisplayName = INI:FactionObserver
  StartMoney = 0
  PreferredColor = R:200 G:200 B:200
  PurchaseScienceCommandSetRank1 = StarterEmptyCommandSet
  PurchaseScienceCommandSetRank3 = StarterEmptyCommandSet
  PurchaseScienceCommandSetRank8 = StarterEmptyCommandSet
  SpecialPowerShortcutCommandSet = StarterEmptyCommandSet
  SpecialPowerShortcutButtonCount = 0
  SpecialPowerShortcutWinName = ControlBar.wnd:ButtonCommand01
  ScoreScreenImage = SP_ScoreIronwood
  LoadScreenImage = SP_LoadIronwood
  EnabledImage = SP_SideObserver
  SideIconImage = SP_SideObserver
  GeneralImage = SP_SideObserver
End

PlayerTemplate FactionCivilian
  Side = Civilian
