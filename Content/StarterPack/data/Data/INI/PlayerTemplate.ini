  StartMoney = 0                 ; 0: the starting cash option of the setup screen decides (Player.cpp)
  PreferredColor = R:70 G:130 B:210
  StartingBuilding = IronwoodHQ
  StartingUnit0 = IronwoodWorker
  StartingUnit1 = IronwoodWorker
  IntrinsicSciencePurchasePoints = 0
  PurchaseScienceCommandSetRank1 = StarterEmptyCommandSet
  PurchaseScienceCommandSetRank3 = StarterEmptyCommandSet
  PurchaseScienceCommandSetRank8 = StarterEmptyCommandSet
  SpecialPowerShortcutCommandSet = StarterEmptyCommandSet
  SpecialPowerShortcutButtonCount = 0
  SpecialPowerShortcutWinName = ControlBar.wnd:ButtonCommand01
  ScoreScreenImage = SP_ScoreIronwood
  LoadScreenImage = SP_LoadIronwood
  LoadScreenMusic = StarterLoadMusic
  ScoreScreenMusic = StarterScoreMusic
  EnabledImage = SP_SideIronwood
  SideIconImage = SP_SideIronwood
